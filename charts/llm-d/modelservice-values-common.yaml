# Topology shared by local, poc, and prod.
# No images, no nodeSelectors, no replica counts here - those are environment
# overrides and belong in modelservice-values-<env>.yaml.
#
# One exception that is arguably topology but CANNOT live here: the named
# "metrics" container port (8000) that Task 7's PodMonitor scrapes by name
# (decode.containers[0].ports / prefill.containers[0].ports in
# modelservice-values-<env>.yaml). Declaring that port is required to scrape
# vLLM in ANY environment - without it, Prometheus's pod service-discovery
# cannot build a target address at all (verified against the installed
# `podmonitors.monitoring.coreos.com` CRD: `port`/`portNumber`/`targetPort`
# all require the Pod to declare the port in its spec, or the target is
# silently dropped - it never even reaches `state=active`, only
# `state=any`). It still can't move here because `decode.containers` /
# `prefill.containers` are LISTS, and Helm replaces a list wholesale across
# `-f` files rather than merging list elements (confirmed empirically with
# `helm template` using two `-f` files that each set part of
# `decode.containers[0]` - whichever file is applied last wins the entire
# list, dropping the other file's fields entirely; with the image-bearing
# file applied first, the render silently drops the port; with it applied
# last, the chart fails outright with "image of container is required").
# So every environment's own values-<env>.yaml must declare `ports` next to
# its own `image`/`command`/`args` in the same container list entry, or its
# pods are silently unscraped. `local/test/07-prometheus.sh` is the guard
# that catches this for local; carry an equivalent guard forward to POC and
# prod.
modelArtifacts:
  name: dummy-model
routing:
  servicePort: 8000
  # The routing-proxy sidecar is disabled because it binds the same port as
  # the model container and collides with it (discovered in Task 5). Additionally,
  # the simulator cannot exercise genuine KV-cache transfer, so Phase 0's scope
  # is proving the topology, not the transfer itself.
  proxy:
    enabled: false
decode:
  create: true
prefill:
  create: true   # The entire prefill/decode disaggregation is this one topology line

# Neither llm-d-infra nor llm-d-modelservice creates a Service or HTTPRoute
# for the pool (verified by reading both charts' templates - there is no
# Service/HTTPRoute/InferencePool template in either chart). Without one the
# Gateway has no route to the decode pods, so the topology must supply the
# HTTPRoute. The third llm-d chart (InferencePool + EPP, installed as
# release "llm-d-ip") supplies the InferencePool itself and watches decode
# Pods directly by label (no Service needed - its RBAC only asks for
# get/watch/list on pods) - so the backendRef targets the InferencePool,
# not a Service. Routing through a plain Service would bypass the EPP
# scheduler entirely and silently fall back to round-robin, which is the
# exact thing llm-d exists to avoid.
# The HTTPRoute's parentRef name matches gateway.fullnameOverride set in
# infra-values-local.yaml (and, by convention, the poc/prod infra values).
# The backendRef name ("llm-d-ip") matches the InferencePool chart's Helm
# release name (the chart names the InferencePool CR after {{ .Release.Name }}).
extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: llm-d-decode-route
    spec:
      parentRefs:
        - name: llm-d-gateway
      rules:
        - backendRefs:
            - group: inference.networking.k8s.io
              kind: InferencePool
              name: llm-d-ip
              port: 8000
