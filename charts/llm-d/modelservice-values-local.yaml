# Differs from a poc/prod file ONLY in image, nodeSelector, replicas, and
# accelerator (plus the container command/probe that go with swapping the
# real vLLM image for the simulator).
accelerator:
  type: cpu
decode:
  replicas: 1
  nodeSelector:
    llm-d.ai/pool: decode
  containers:
    - name: vllm
      # $INFERENCE_SIM_VERSION verbatim, v included - v0.10.2 exists, 0.10.2 does not.
      image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
      # The chart's default modelCommand ("custom") requires an explicit
      # command - the image's own ENTRYPOINT (verified via `docker inspect`)
      # is /app/llm-d-inference-sim, so pass it through explicitly.
      command: ["/app/llm-d-inference-sim"]
      args: ["--model", "dummy-model", "--port", "8000", "--mode", "random"]
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 2
        periodSeconds: 3
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 512Mi }
prefill:
  replicas: 1
  nodeSelector:
    llm-d.ai/pool: prefill
  containers:
    - name: vllm
      image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
      command: ["/app/llm-d-inference-sim"]
      args: ["--model", "dummy-model", "--port", "8000", "--mode", "random"]
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 2
        periodSeconds: 3
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits:   { cpu: 500m, memory: 512Mi }
