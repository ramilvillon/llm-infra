kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-d-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # gateway
        hostPort: 30080
        protocol: TCP
      - containerPort: 30300   # grafana
        hostPort: 30300
        protocol: TCP
      - containerPort: 30500   # mlflow
        hostPort: 30500
        protocol: TCP
  - role: worker
    labels:
      llm-d.ai/pool: prefill
  - role: worker
    labels:
      llm-d.ai/pool: decode
