apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-smoke
  namespace: llm-d-smoke
spec:
  replicas: 1
  selector:
    matchLabels: { app: sim-smoke }
  template:
    metadata:
      labels: { app: sim-smoke }
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:SIM_VERSION
          args: ["--model", "llm-d-chat", "--port", "8000", "--mode", "random"]
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sim-smoke
  namespace: llm-d-smoke
spec:
  selector: { app: sim-smoke }
  ports:
    - port: 8000
      targetPort: 8000
